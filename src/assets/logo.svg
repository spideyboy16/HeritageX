<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A2E" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E5C378" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Architectural Jali / Stepwell Geometric Emblem -->
  <g transform="translate(10, 8)">
    <rect x="2" y="2" width="44" height="44" rx="8" stroke="url(#goldGrad)" stroke-width="1.5" fill="#181614" fill-opacity="0.8"/>
    <!-- Interlocking Heritage Diamond & Arch motif -->
    <path d="M24 8 L38 24 L24 40 L10 24 Z" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.9"/>
    <path d="M24 14 L32 24 L24 34 L16 24 Z" stroke="#E5C378" stroke-width="1" fill="#221F1C"/>
    <circle cx="24" cy="24" r="3" fill="url(#goldGrad)"/>
    <!-- Cardinal accent marks -->
    <line x1="24" y1="4" x2="24" y2="8" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="40" x2="24" y2="44" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="8" y2="24" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="24" x2="44" y2="24" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="36" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="700" letter-spacing="0.12em" fill="#F8F6F0">HERITAGE</text>
  <text x="206" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="25" font-weight="800" fill="url(#goldGrad)">X</text>
  <text x="69" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.28em" fill="#A89E8C">CULTURAL ARCHIVE OF INDIA</text>
</svg>
